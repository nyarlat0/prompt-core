[package]
name = "prompt-core"
version = "0.1.0"
edition = "2024"
description = "Reusable prompt templating, SillyTavern-style prompt building, and KoboldCpp inference client"
readme = "README.md"

[features]
default = []
roleplay = ["dep:base64", "dep:rsmorphy"]

[dependencies]
anyhow = "1.0.104"
base64 = { version = "0.22.1", optional = true }
rsmorphy = { version = "0.4.0", optional = true }
handlebars = "6.4.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
